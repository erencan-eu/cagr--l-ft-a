<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çağrı Lift Asansör - Montajlar</title>
    <style>
        /* Genel sayfa stil ayarları */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }

        /* Arka plana asansör resmi */
        .container {
            width: 100%;
            height: 100vh;
            background-image: url('https://link-to-your-elevator-image.jpg'); /* Buraya asansör resminizin URL'sini koyun */
            background-size: cover;
            background-position: center;
            padding: 40px;
            box-sizing: border-box;
        }

        /* Tema için yazı ve içerik düzeni */
        .content {
            background-color: rgba(255, 255, 255, 0.8); /* Yarı saydam beyaz arka plan */
            border-radius: 8px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .info h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #0077b6;
        }

        .info p {
            font-size: 18px;
            color: #333;
            margin: 8px 0;
        }

        a {
            color: #0077b6;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="content">
            <h1>Çağrı Lift Asansör - Montajlar</h1>

            <div class="info">
                <h2>Bora İnşaat</h2>
                <p>Ceyhunlar</p>
                <p>Er Hilal</p>
            </div>
        </div>
    </div>

</body>
</html>
