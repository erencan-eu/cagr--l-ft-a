<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çağrı Lift Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Fon müziği -->
    <audio autoplay loop>
        <source src="assets/music/elevator-music.mp3" type="audio/mp3">
    </audio>

    <!-- Giriş ekranı -->
    <div class="container">
        <h1>Çağrı Lift Admin Paneli</h1>

        <!-- Bakımlar -->
        <div class="bakim">
            <h2 onclick="toggleBakim()">Bakımlar</h2>
            <div id="bakim-form" class="hidden">
                <label>Bina Adı:</label>
                <input type="text" id="building-name" placeholder="Bina adı" />
                <label>Telefon Numarası:</label>
                <input type="text" id="phone-number" placeholder="Telefon" />
                <label>Yönetici Adı:</label>
                <input type="text" id="manager-name" placeholder="Yönetici Adı" />
                <label>Konum:</label>
                <input type="text" id="location" placeholder="Konum" />
            </div>
        </div>

        <!-- Montajlar -->
        <div class="montaj">
            <h2>Montajlar</h2>
            <div class="montaj-item">
                <label for="building-name">Bina Adı:</label>
                <input type="text" id="building-name-montaj" placeholder="Bina adı" />
                <button onclick="saveBuilding()">Kaydet</button>
            </div>
        </div>

        <!-- Revizyonlar -->
        <div class="revizyon">
            <h2>Revizyonlar</h2>
            <div class="revizyon-item">
                <label>Bina İsmi:</label>
                <input type="text" id="building-revision" placeholder="Bina adı" />
                <textarea id="materials" placeholder="Malzemeler"></textarea>
                <label for="done">Yapıldı:</label>
                <input type="checkbox" id="done" />
            </div>
        </div>

        <footer>
            <p>Çağrı Lift Admin Paneli</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
