<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asansör Bakım Paneli</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e8f0fe;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .panel {
            background-color: #ffffff;
            padding: 30px 25px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        .map-link {
            display: block;
            margin: 10px 0;
            text-align: center;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .map-link:hover {
            text-decoration: underline;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="panel">
        <h2>Bakım Bilgisi Girişi</h2>
        <form>
            <input type="text" name="bina_ismi" placeholder="Bina İsmi" value="Miraç Ege" required>
            <input type="text" name="yonetici_adi" placeholder="Yönetici Ad Soyad" value="Eren Can Öztürk" required>
            <input type="tel" name="telefon_no" placeholder="Telefon No" value="05300693934" required>
            <input type="text" name="kapi_sifresi" placeholder="Kapı Şifresi" value="2525" required>
            <a class="map-link" href="https://maps.app.goo.gl/w9rUWYG74wWwRJGz6" target="_blank">Konumu Gör (Google Maps)</a>
            <button type="submit">Kaydet</button>
        </form>
    </div>
</body>
</html>
